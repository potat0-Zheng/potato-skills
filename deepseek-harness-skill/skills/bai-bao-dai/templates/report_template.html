<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE --></title>
<!-- theme-v: 0.2.13 -->
<!-- 本文件由 sync_theme.py 从 ~/.dsh/report-theme/ 同步分发。请勿手工修改各 skill 内的副本；
     修改皮肤请改主模板 report-theme/report_template.html，然后运行 report-theme/sync_theme.py。 -->

<style>
  /* ═══════════════════ 设计令牌 · Editorial 风格（基于 Raleighawesome/html-design-skill，Apache 兼容） ═══════════════════ */
  :root {
    /* 底色与纸张 */
    --ivory: #faf9f5;
    --paper: #ffffff;
    --slate: #141413;
    --clay: #b0573b;
    --oat: #e3dacc;
    --olive: #66794f;
    --gray-50: #f0eee6;
    --gray-100: #e6e3da;
    --gray-200: #d1cfc5;
    --gray-500: #6f6e68;
    --gray-700: #3d3d3a;
    /* 字体（中文优先，离线回退系统字体） */
    --serif: "Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,"Times New Roman",serif;
    --sans: system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;
    --radius: 14px;
    --focus: #7a321f;
    /* 确定性标记语义色：▲官方 / ●多源 / △单源 */
    --c-official: #0e6b57;
    --c-multi: #12508f;
    --c-single: #8a6512;
    --c-caution: #8b2f6a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ivory); color: var(--slate);
    font-family: var(--sans); font-size: 16px; line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--clay); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  /* ═══════════════════ 页面骨架 ═══════════════════ */
  .wrap { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding-bottom: 120px; }

  /* 报头区（可选，LLM 内容可自建）：eyebrow + h1 + intro + toc + hero-figure */
  .masthead { padding: 64px 0 44px; border-bottom: 1.5px solid var(--gray-200); }
  .hero-grid { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 48px; align-items: end; }
  .hero-grid > * { min-width: 0; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--gray-500); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
  .eyebrow::before { content: ""; width: 24px; height: 2px; background: var(--clay); flex: none; }
  h1 { max-width: 24ch; margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 4.6vw, 52px); line-height: 1.14; }
  h1 em { color: var(--clay); font-style: italic; }
  .intro { max-width: 640px; margin: 20px 0 0; color: var(--gray-700); font-size: 16px; }
  .hero-figure { min-width: 0; margin: 0; padding: 18px; border: 1.5px solid var(--slate); border-radius: var(--radius); background: var(--paper); box-shadow: 0 12px 32px rgb(20 20 19 / 10%); }
  .hero-figure .kpi { font-family: var(--serif); font-size: 42px; line-height: 1.05; margin: 0 0 8px; }
  .hero-figure .kpi span { color: var(--clay); }
  .hero-figure .kpi-sub { font-family: var(--mono); font-size: 11px; color: var(--gray-500); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 14px; }
  .hero-figure ul { margin: 0; padding-left: 18px; color: var(--gray-700); font-size: 13px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 24px; }
  .toc a, .pill { padding: 7px 14px; border: 1.5px solid var(--gray-200); border-radius: 999px; background: var(--paper); color: var(--gray-700); font-size: 12.5px; text-decoration: none; }
  .toc a:hover { border-color: var(--slate); color: var(--slate); }

  /* ═══════════════════ 章节与标题（程序化与 LLM 内容共用） ═══════════════════ */
  section { margin-top: 64px; scroll-margin-top: 28px; }
  h2, h3, h4, h5 { font-family: var(--serif); font-weight: 600; color: var(--slate); }
  h2 { font-size: 26px; margin: 2em 0 0.6em; padding-bottom: 0.35em; border-bottom: 1.5px solid var(--gray-200); }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 20px; margin: 1.7em 0 0.55em; }
  /* 注入式 markdown 小节标题（极简 md 渲染：md 一级→h3、二级→h4、三级→h5）：
     h4 需与正文（16px/#141413）拉开层级，故加号加色；h5 作更低一级的灰色小标题 */
  h4 { font-size: 18px; margin: 1.6em 0 0.45em; color: var(--slate); }
  h5 { font-size: 15px; margin: 1.3em 0 0.4em; color: var(--gray-700); }
  /* 标题编号方案（v0.2.8）：章标题 h2 文本保留手写中文序数（一、二、…），不改动；
     章内小节标题由 CSS 计数器自动渲染：h3 →「1.1」、h4 →「1.1.1」、h5 →「1.1.1.1」，
     首位=章序（正文 h2 的出现顺序），其后逐级递增。
     只作用于 <main> 的直接子级标题（与 h2 平级）；.meta-box/.card/details 等容器内的标题不编号。
     正文小节标题文本请勿再手写任何序号前缀（中文「一、」或数字「1.1」都会与自动编号重复）；
     编号按实际出现的标题层级推进，请勿跳级（如章内首个小节直接写 h4）。 */
  main.wrap { counter-reset: chap; }
  main.wrap > h2 { counter-increment: chap; counter-reset: sec; }
  main.wrap > h3 { counter-reset: sub; }
  main.wrap > h4 { counter-reset: subsub; }
  main.wrap > h3::before,
  main.wrap > h4::before,
  main.wrap > h5::before {
    color: var(--clay); font-family: var(--mono); font-size: 0.78em;
    font-weight: 600; letter-spacing: .02em; margin-right: .6em; white-space: nowrap;
  }
  main.wrap > h3::before { counter-increment: sec; content: counter(chap) "." counter(sec) "　"; }
  main.wrap > h4::before { counter-increment: sub; content: counter(chap) "." counter(sec) "." counter(sub) "　"; }
  main.wrap > h5::before { counter-increment: subsub; content: counter(chap) "." counter(sec) "." counter(sub) "." counter(subsub) "　"; }
  /* 编号章节头（LLM 可选增强）：01/02/03 序号 */
  .section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
  .section-head .index { width: 44px; color: var(--clay); font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .02em; flex: none; }
  .section-head h2 { margin: 0; border-bottom: none; padding-bottom: 0; }
  .section-intro { max-width: 700px; margin: 0 0 24px 50px; color: var(--gray-700); font-size: 14.5px; }
  /* 章节导读（build_report 程序化输出/--intros 注入；无 section-head 序号，故不缩进） */
  .chapter-intro { max-width: 700px; margin: 0 0 1.2em; color: var(--gray-700); font-size: 14.5px; }

  /* ═══════════════════ 正文排版（中文友好） ═══════════════════ */
  p { max-width: 72ch; }
  p, li { margin: 0.7em 0; }
  ol, ul { margin: 0.6em 0; padding-left: 1.6em; }
  blockquote { border-left: 3px solid var(--gray-200); margin: 0.8em 0; padding: 0.3em 0.9em; background: var(--paper); color: var(--gray-700); font-size: 0.95em; }
  code { background: var(--gray-50); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; font-family: var(--mono); }
  .subtitle { color: var(--gray-500); font-size: 0.95em; }
  .caption { font-family: var(--mono); font-size: 11.5px; line-height: 1.68; color: var(--gray-500); margin: 12px 0 0; max-width: 78ch; }

  /* ═══════════════════ 结论速览卡（meta-box，百宝袋程序化输出） ═══════════════════ */
  .meta-box { margin: 1.4em 0; padding: 20px 24px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); background: var(--paper); font-size: 0.95em; }
  .meta-box dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; }
  .meta-box dt { font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; color: var(--gray-500); padding-top: 2px; }
  .meta-box dd { margin: 0; }

  /* ═══════════════════ 报告仪表盘 KPI（build_report 程序化输出） ═══════════════════ */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 1.4em 0 0.2em; }
  .kpi-card { padding: 16px 18px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); background: var(--paper); }
  .kpi-num { font-family: var(--serif); font-size: 30px; line-height: 1.12; margin-bottom: 4px; }
  .kpi-num span { font-size: 0.62em; color: var(--clay); margin-left: 2px; }
  .kpi-lab { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--gray-500); text-transform: uppercase; }
  .kpi-sub { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--gray-700); }

  /* ═══════════════════ 表格（来源索引 / 立场分布 / 覆盖声明） ═══════════════════ */
  table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 13.5px; background: var(--paper); }
  th, td { border: 1px solid var(--gray-100); padding: 0.5em 0.7em; text-align: center; vertical-align: middle; }
  th { background: var(--oat); font-weight: 600; font-family: var(--serif); }
  tbody tr:nth-child(even) { background: var(--gray-50); }
  /* 来源分级着色（A=官方/权威，B=主流，C=自媒体） */
  .source-A, tr.source-A { background: #e9e0cc; }
  .source-B, tr.source-B { background: #f6f4ee; }
  .source-C, tr.source-C { background: #f4e9e3; }
  /* 来源索引锚点行：编号列等宽 */
  tr[id^="ref"] td:first-child { font-family: var(--mono); color: var(--gray-500); white-space: nowrap; }

  /* 长表滚动容器（v0.2.13）：固定高度 + 内置滚动 + 吸顶表头；打印时自动展开全文 */
  /* 用法：把超长表格包在 <div class="table-scroll">…</div> 内（如第六章来源索引这类超长表） */
  .table-scroll { max-height: min(58vh, 540px); overflow-y: auto; border: 1px solid var(--gray-200); border-radius: var(--radius); background: var(--paper); }
  .table-scroll table { margin: 0; }
  .table-scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--oat); box-shadow: 0 1px 0 var(--gray-200); }
  .table-scroll::-webkit-scrollbar { width: 8px; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  @media print {
    .table-scroll { max-height: none; overflow: visible; border: none; border-radius: 0; }
    .table-scroll thead th { position: static; box-shadow: none; }
  }

  /* ═══════════════════ 引用与确定性标记 ═══════════════════ */
  .ref { font-size: 0.85em; color: var(--clay); text-decoration: none; font-family: var(--mono); }
  .ref:hover { text-decoration: underline; }

  /* 引用悬停气泡卡（v0.2.13）：悬停/聚焦正文 a.ref（#refN）时由装配端 refpop JS 读取本页索引行浮出；
     皮肤只供样式；无 JS 时退回纯跳转 */
  .refpop { position: absolute; z-index: 1400; max-width: min(380px, 88vw); padding: 10px 12px 9px;
            background: var(--paper); border: 1px solid var(--gray-200); border-left: 3px solid var(--clay);
            border-radius: 10px; box-shadow: 0 10px 30px rgb(20 20 19 / 16%);
            font-size: 12px; line-height: 1.55; color: var(--gray-700); }
  .refpop .rp-num { font-family: var(--mono); font-size: 10px; color: var(--clay); letter-spacing: .04em; }
  .refpop .rp-src { font-family: var(--serif); font-weight: 600; font-size: 13px; color: var(--slate); }
  .refpop .rp-title { margin: 2px 0 5px; font-size: 11.5px; color: var(--gray-500); line-height: 1.5; }
  .refpop .rp-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-family: var(--mono); font-size: 10px; color: var(--gray-500); }
  .refpop .rp-link { margin-top: 6px; font-size: 11.5px; }
  .refpop .rp-link a { color: var(--clay); text-decoration: none; border-bottom: 1px dashed var(--gray-200); }
  .refpop .rp-link a:hover { border-bottom-color: var(--clay); }
  .mark { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 5px; font-family: var(--mono); font-size: 11px; line-height: 1.6; }
  .mark-official { background: #e3efe9; color: var(--c-official); }   /* ▲ 官方确认 */
  .mark-multi { background: #e4ecf5; color: var(--c-multi); }         /* ● 多源一致 */
  .mark-single { background: #f3ead9; color: var(--c-single); }       /* △ 单源存疑 */
  .mark-caution { background: #f3e3ec; color: var(--c-caution); }
  .legend { font-size: 0.85em; color: var(--gray-500); margin: 1.2em 0 0; font-family: var(--mono); }

  /* ═══════════════════ 时间线 / 立场 / 卡片（LLM 内容组件） ═══════════════════ */
  .report-list { margin-left: 50px; }
  .report-row { display: grid; grid-template-columns: 130px 1fr; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--gray-100); align-items: start; }
  .report-row time, .report-owner { color: var(--gray-500); font-family: var(--mono); font-size: 11px; }
  .report-row strong { display: block; margin-bottom: 4px; font-family: var(--serif); font-size: 17px; font-weight: 600; }
  /* 立场区专用：标签列 + 内容列 */
  .stance-row { display: grid; grid-template-columns: 110px 1fr; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--gray-100); align-items: start; }
  .stance-row .label { color: var(--clay); font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .stance-row .label .mark { display: block; margin: 6px 0 0; width: fit-content; }
  .stance-row p { margin: 0; color: var(--gray-700); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr)); gap: 20px; margin-left: 50px; }
  .card { display: flex; min-height: 150px; flex-direction: column; padding: 22px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); background: var(--paper); transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease; }
  .card:hover { transform: translateY(-3px); border-color: var(--slate); box-shadow: 0 10px 28px rgb(20 20 19 / 9%); }
  .card h3 { margin: 0 0 8px; font-size: 20px; }
  .card p { margin: 0; color: var(--gray-700); font-size: 14px; }
  .card .meta { margin-top: auto; padding-top: 20px; color: var(--gray-500); font-family: var(--mono); font-size: 11px; }
  .note { margin: 1.2em 0 1.2em 50px; padding: 18px 22px; border-left: 4px solid var(--olive); background: var(--paper); color: var(--gray-700); }

  /* ═══════════════════ 折叠（长文本收纳：<details class="fold">，打印自动展开） ═══════════════════ */
  details.fold { margin: 1em 0; border: 1px solid var(--gray-200); border-radius: 10px; background: var(--paper); }
  details.fold > summary { cursor: pointer; list-style: none; padding: 9px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--gray-700); letter-spacing: .02em; user-select: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸ "; color: var(--clay); }
  details.fold[open] > summary::before { content: "▾ "; }
  details.fold > summary:hover { color: var(--slate); }
  details.fold > *:not(summary) { padding: 2px 14px 12px; }
  @media print {
    details.fold > summary { display: none; }
    details.fold > *:not(summary) { display: block !important; padding: 0; }
    details.fold { border: none; margin: 0.8em 0; }
  }

  /* ---- 折叠渐缓弹出（v0.2.13）：由装配端 fold-replay JS 用 WAAPI 命令式动画实现。
        皮肤层不写 animation 规则——CSS animation 在 <details> 隐藏子树中不重放（仅首开生效）；
        无 JS / 老浏览器 / reduced-motion 时回退为原生瞬开。 ---- */

  /* ═══════════════════ P1 可视化（build_report 程序化输出；纯 CSS 零 JS） ═══════════════════ */
  /* 立场分布横向条形 */
  .bars { margin: 1.2em 0; }
  .bar-row { display: grid; grid-template-columns: 150px minmax(0,1fr) 118px auto; gap: 10px; align-items: center; padding: 5px 0; }
  .bar-label { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { display: block; height: 14px; border-radius: 7px; background: var(--gray-100); overflow: hidden; }
  .bar-fill { display: block; height: 100%; border-radius: 7px; background: var(--clay); min-width: 2px; }
  .bar-val { font-family: var(--mono); font-size: 11.5px; color: var(--gray-500); white-space: nowrap; }
  .bar-row .mark { margin: 0; }
  /* 统计小结行（来源/分级） */
  .stat-line { font-family: var(--mono); font-size: 11.5px; color: var(--gray-500); margin: 1em 0 0.2em; }
  .stat-line strong { color: var(--slate); font-weight: 600; }
  /* 覆盖缺口矩阵 */
  table.matrix { font-size: 12.5px; }
  table.matrix td.cell-ok { background: #e9e0cc; color: #a44a2e; }
  table.matrix td.cell-miss { background: var(--gray-100); color: var(--gray-700); }
  table.matrix td.cell-gap { background: #f6e9dd; color: var(--c-single); }
  /* 焦点转移堆叠条（立场 × 日期）；立场色环 s1..s5，超出用灰 */
  .stacks { margin: 1.2em 0; }
  .stack-row { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 12px; align-items: center; padding: 4px 0; }
  .stack-date { font-family: var(--mono); font-size: 11.5px; color: var(--gray-500); }
  .stack-track { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--gray-100); }
  .stack-seg { display: block; height: 100%; background: var(--gray-300, #d1cfc5); }
  .stack-seg.s1 { background: #b0573b; } .stack-seg.s2 { background: #8a6512; }
  .stack-seg.s3 { background: #66794f; } .stack-seg.s4 { background: #3d3d3a; }
  .stack-seg.s5 { background: #d1cfc5; } .stack-seg.s6 { background: #87786a; }
  .stack-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; }
  .stack-legend span { display: inline-flex; align-items: center; font-size: 11.5px; color: var(--gray-700); }
  .stack-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  /* 图例色块与段色一致（v0.2.13）：支持 <i class="s1..s6">（此前只有 inline 底色可用，图例无色） */
  .stack-legend i.s1 { background: #b0573b; } .stack-legend i.s2 { background: #8a6512; }
  .stack-legend i.s3 { background: #66794f; } .stack-legend i.s4 { background: #3d3d3a; }
  .stack-legend i.s5 { background: #d1cfc5; } .stack-legend i.s6 { background: #87786a; }

  /* ═══════════════════ 可视化补充（v0.2.13）：双栏 .chart-split / 环形 .donut / 趋势线 .trend ═══════════════════ */
  /* 图表双栏：左条右环 / 左堆叠右趋势；上下居中（与对侧图中心对齐），≤880px 塌成单列 */
  .chart-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px 44px; align-items: center; margin: 1.2em 0; }
  .chart-split > * { min-width: 0; }
  @media (max-width: 880px) { .chart-split { grid-template-columns: 1fr; gap: 18px; } }
  /* 环形图：conic-gradient 分段（inline 百分比直转 deg），mask 掏洞成环；不支持 mask 时回退实心饼 */
  .donut { width: min(230px, 100%); aspect-ratio: 1 / 1; border-radius: 50%; margin: .8em auto .6em;
           -webkit-mask: radial-gradient(closest-side, transparent 58%, #000 59%);
                   mask: radial-gradient(closest-side, transparent 58%, #000 59%); }
  .donut-legend { list-style: none; margin: 0 auto; padding: 0; width: fit-content; }
  .donut-legend li { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; color: var(--gray-700); }
  .donut-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .donut-legend b { font-family: var(--mono); font-weight: 600; color: var(--slate); }
  /* 趋势折线：静态 SVG（生成端 --stance-trend 计算坐标），皮肤只供样式/图例 */
  .trend { margin: .2em 0 0; }
  .trend-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: .5em; }
  .trend-title { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--slate); }
  .trend-sub { font-family: var(--mono); font-size: 10.5px; color: var(--gray-500); }
  .trend-svg { width: 100%; height: auto; display: block; background: var(--paper); border: 1px solid var(--gray-100); border-radius: var(--radius); }
  .trend text { font-family: var(--mono); font-size: 9.5px; fill: var(--gray-500); }
  .trend .grid-line { stroke: var(--gray-100); stroke-width: 1; }
  .trend .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .trend .area { stroke: none; }
  .trend .dot { stroke: var(--paper); stroke-width: 1.5; }
  .trend .s1 { stroke: #b0573b; } .trend .s2 { stroke: #8a6512; } .trend .s3 { stroke: #66794f; } .trend .s4 { stroke: #3d3d3a; }
  .trend-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: .5em 0 0; padding: 0; list-style: none; }
  .trend-legend li { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--gray-700); }
  .trend-legend i { width: 16px; height: 2.5px; border-radius: 2px; background: var(--clay); flex: none; }

  /* ═══════════════════ 视点综合（v0.2.13）：LLM 深度内容块的小节识别样式 ═══════════════════ */
  /* h3 标题后紧跟 .viewpoint-meta 时视为「视点综合」开启（:has 增强，不影响自动编号——
     h3 仍是 <main> 直接子级，序号照常渲染） */
  main.wrap > h3:has(+ .viewpoint-meta) { margin-bottom: .45em; }
  .viewpoint-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
                    margin: 0 0 1.1em; padding: .5em .9em;
                    background: var(--paper); border-left: 3px solid var(--clay); border-radius: 0 8px 8px 0;
                    font-size: 12.5px; color: var(--gray-700); }
  .viewpoint-snap { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
                    border-radius: 999px; background: #f6e9dd; color: #a44a2e;
                    font-family: var(--mono); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
  .viewpoint-snap::before { content: "◷ "; font-size: 1.1em; line-height: 1; }
  @media print { .viewpoint-meta { break-inside: avoid; } }

  /* ═══════════════════ 立场卡组 + 论证链带（v0.2.13，视点综合 5.1.2 结构可视化） ═══════════════════ */
  /* 把连续长段落式「各立场论证」拆成卡：卡头(名+占比+视角) / 论证链 .ssteps / 原文 / 防呆 note
     跨卡对齐策略：卡等高 + 卡头固定两行（行1 名+占比、行2 视角）+ 论证链节点 min-height 等高
     + 引用区 .quote-list 弹性伸展吸收高度差 → 「代表性原文」标签与「防呆 note」跨卡对齐 */
  .scards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px; margin: 1.2em 0; align-items: stretch; }
  .scard { display: flex; flex-direction: column; padding: 16px 16px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); background: var(--paper); }
  /* 卡头：两行网格（名+占比 一行、视角 一行），各行起点跨卡一致 */
  .scard-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 10px; row-gap: 3px; margin-bottom: 6px; }
  .scard-name { grid-column: 1; font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--slate); }
  .scard-pct { grid-column: 2; justify-self: start; font-family: var(--mono); font-size: 10.5px; color: #a44a2e; background: #f6e9dd; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .scard-view { grid-column: 1 / -1; font-size: 11px; color: var(--gray-500); font-family: var(--mono); letter-spacing: .02em; }
  .scard-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--gray-500); margin: 12px 0 4px; }
  /* 论证链步骤带：数字圆点 + 节点卡 + 箭头（纯 CSS 自动编号）；节点 min-height 等宽，跨卡步骤带起点一致 */
  .ssteps { counter-reset: stepc; display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .sstep { counter-increment: stepc; flex: 1 1 0; min-width: 120px; min-height: 2.3em; display: flex; align-items: center; gap: 7px;
           border: 1px solid var(--gray-100); border-radius: 8px; background: var(--gray-50);
           padding: 6px 9px; font-size: 11.5px; line-height: 1.5; color: var(--gray-700); }
  .sstep::before { content: counter(stepc); flex: none; width: 16px; height: 16px; border-radius: 50%;
                   background: var(--clay); color: var(--paper); font-family: var(--mono); font-size: 10px; font-weight: 700;
                   display: inline-flex; align-items: center; justify-content: center; }
  .sstep:not(:last-child)::after { content: "→"; align-self: center; margin: 0 0 0 auto; padding-left: 2px; color: var(--clay); font-family: var(--serif); }
  /* 引用区为弹性槽：吸收卡间高度差 → 卡尾「防呆 note」齐底（引用正文仍在「代表性原文」标签下方齐顶） */
  .scard .quote-list { flex: 1 1 auto; }
  .scard .quote-item { padding: 4px 0; }
  .scard-note { margin: 10px 0 0; padding: 7px 10px; font-size: 11.5px; line-height: 1.55; color: var(--gray-700);
                border-left: 3px solid var(--olive); background: var(--gray-50); border-radius: 0 6px 6px 0; }
  @media print { .scard, .ssteps { break-inside: avoid; } }

  /* ═══════════════════ 表格内「高赞代表」条目（v0.2.13）：cell 中多条评论逐条成块 ═══════════════════ */
  /* 用法：<div class="quote-list"> <div class="quote-item"><span class="quote-like">赞 N</span><span class="quote-txt">正文</span></div> … </div> */
  .quote-list { display: flex; flex-direction: column; gap: 2px; }
  .quote-item { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 5px 0; }
  .quote-item + .quote-item { border-top: 1px dashed var(--gray-100); }
  .quote-like { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: #a44a2e; background: #f6e9dd; border-radius: 5px; padding: 0 7px; white-space: nowrap; margin-top: 1px; }
  .quote-txt { font-size: 12.5px; line-height: 1.62; color: var(--gray-700); }
  @media (max-width: 640px) { .quote-item { grid-template-columns: 1fr; gap: 2px; } .quote-like { width: fit-content; } }

  /* ═══════════════════ P2 组件（--actors / --track 可选输入，无输入不渲染） ═══════════════════ */
  /* 角色小词典：分组标题 + 卡内关键言论 */
  .actors-side { margin: 0.9em 0 0.2em 50px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; color: var(--gray-500); }
  .card .quotes { margin-top: 0.5em; font-size: 12.5px; line-height: 1.6; color: var(--gray-700); }
  /* 说法×证实 双轨时间轴 */
  table.dualtrack { font-size: 13px; }
  table.dualtrack th:nth-child(1) { width: 15%; }
  table.dualtrack td { vertical-align: top; }
  table.dualtrack td.cell-verify { background: #f6f4ee; }

  /* 图像（预留，与 v0.1 兼容） */
  .img-card { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 1em; margin: 1em 0; background: var(--paper); }
  .img-card img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 0.5em 0; }
  .img-card .meta { font-size: 0.8em; color: var(--gray-500); margin-top: 0.2em; font-family: var(--mono); }
  .img-fallback { font-size: 0.85em; color: var(--gray-700); padding: 1em; background: #f7efdc; border-radius: 8px; }

  hr { border: none; border-top: 1.5px solid var(--gray-200); margin: 1.8em 0; }

  /* ═══════════════════ 页脚 ═══════════════════ */
  footer { margin-top: 96px; padding-top: 32px; border-top: 1.5px solid var(--gray-200); color: var(--gray-500); font-size: 13px; }
  .footer { text-align: center; color: var(--gray-500); font-size: 0.82em; margin-top: 3em; }

  /* ═══════════════════ 响应式 ═══════════════════ */
  @media (max-width: 880px) { .hero-grid { grid-template-columns: 1fr; } .hero-figure { max-width: 420px; } }
  @media (max-width: 640px) {
    .wrap { width: min(100% - 40px, 1120px); }
    .masthead { padding-top: 48px; }
    .section-intro, .grid, .note, .report-list { margin-left: 0; }
    .report-row, .stance-row { grid-template-columns: 1fr; gap: 6px; }
    .stance-row .label .mark { display: inline-block; margin: 0 0 0 6px; }
    .meta-box dl { grid-template-columns: 1fr; gap: 2px 0; }
  }

  /* ═══════════════════ 无障碍与打印 ═══════════════════ */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
  @media print {
    body { background: #fff; color: #000; font-size: 12px; }
    .wrap { width: 100%; padding: 0; }
    nav, .toc, .bnav { display: none; }
    h2 { break-before: page; page-break-after: avoid; }
    h2:first-child { break-before: auto; }
    .card, .hero-figure, .note, .meta-box, .kpi-card, .abstract, .claim, .tl-item, table { break-inside: avoid; box-shadow: none; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
  }

  /* ═══════════════════ v0.2.9 组件：悬浮目录 / 时间轴 / 裁决徽章 / 断言卡 / 摘要 ═══════════════════ */
  /* ---- 左侧常驻目录栏（v0.2.12 起）：透明底、常展开，无触发钮/遮罩；.bnav-item.active 由内联 JS 滚动高亮 ---- */
  body:has(.bnav) { padding-left: 240px; }   /* 内容让位于左侧目录列（.wrap 仍在剩余宽度内水平居中） */
  .bnav { position: fixed; left: 0; top: 0; bottom: 0; z-index: 1200;
          width: 240px; display: flex; flex-direction: column;
          background: transparent; border-right: 1px solid var(--gray-100);
          font-family: var(--sans); color: var(--slate); }
  .bnav-head { display: flex; align-items: center; padding: 30px 22px 12px; }
  .bnav-head .t { font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .18em; color: var(--slate); }
  .bnav-list { margin: 0; padding: 6px 14px 24px; list-style: none; overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .bnav-item { display: block; margin: 1px 0; padding: 6px 10px 6px 12px;
               border-left: 3px solid transparent; border-radius: 0 8px 8px 0;
               color: var(--gray-500); text-decoration: none; font-size: 13px; line-height: 1.5;
               transition: color .15s ease, background .15s ease, border-color .15s ease; }
  .bnav-item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bnav-item:hover { color: var(--slate); background: rgba(176, 87, 59, .07); }
  .bnav-item.active { border-left-color: var(--clay); color: var(--clay); background: #f6e9dd; font-weight: 600; }
  .bnav-foot { padding: 10px 22px 18px; font-size: 11px; color: var(--gray-500); font-family: var(--mono); }
  @media (max-width: 880px) {
    body:has(.bnav) { padding-left: 0; }
    .bnav { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .bnav-item { transition: none; } }
  @media print {
    body:has(.bnav) { padding-left: 0; }
    .bnav { display: none !important; }
  }

  /* ---- 竖式里程碑时间轴（ch2）：.tl > .tl-item（.tl-date / .tl-dot.tg-* / .tl-body）---- */
  .tl{position:relative;margin:1.5em 0 1em}
  .tl::before{content:"";position:absolute;left:136px;top:10px;bottom:10px;width:2px;background:var(--gray-100)}
  .tl-item{position:relative;display:grid;grid-template-columns:118px 18px 1fr;column-gap:14px;padding:12px 0;border-bottom:1px solid var(--gray-100)}
  .tl-item:last-child{border-bottom:none}
  .tl-date{font-family:var(--mono);font-size:11px;color:var(--gray-500);text-align:right;padding-top:3px;line-height:1.45}
  .tl-date b{display:block;font-family:var(--serif);font-size:15px;color:var(--slate);font-weight:600;letter-spacing:.02em}
  .tl-cnt{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--gray-50);border:1px solid var(--gray-100);color:var(--gray-500);font-size:10.5px;white-space:nowrap}
  .tl-dot{position:relative;width:12px;height:12px;border-radius:50%;margin:7px auto 0;z-index:1;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--gray-200)}
  .tl-dot.tg-official{background:#b0573b}.tl-dot.tg-media{background:#141413}.tl-dot.tg-view{background:#8a6512}
  .tl-dot.tg-bg{background:#6f6e68}.tl-dot.tg-quiet{background:#8a8a84}.tl-dot.tg-check{background:#66794f}
  .tl-body strong{display:block;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--slate);margin-bottom:2px;line-height:1.35}
  .tl-body p{margin:0;color:var(--gray-700);font-size:13.5px;line-height:1.62;max-width:72ch}
  .tl-tag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:5px;font-family:var(--mono);font-size:10.5px;vertical-align:1.5px}
  .tl-tag.tg-official{background:#f6e9dd;color:#a44a2e}.tl-tag.tg-media{background:#ece8de;color:#3d3d3a}
  .tl-tag.tg-view{background:#f3ead9;color:#8a6512}.tl-tag.tg-bg{background:#f0eee6;color:#6f6e68}
  .tl-tag.tg-quiet{background:var(--gray-50);color:var(--gray-500)}.tl-tag.tg-check{background:#ecefe2;color:#55693f}
  @media(max-width:640px){.tl::before{display:none}.tl-item{grid-template-columns:1fr;gap:4px}.tl-date{text-align:left}}

  /* ---- 裁决徽章族（与 .mark-* 证据徽章分族）：.v.v-true 真实 / .v.v-part 部分真实·观点性 ---- */
  .v{display:inline-block;padding:2px 9px;border-radius:999px;font-family:var(--mono);font-size:11px;line-height:1.7}
  .v.v-true{background:#f6e9dd;color:#a44a2e}
  .v.v-part{background:#f3ead9;color:#8a6512}
  /* 第四章分布胶囊 */
  .vpills{display:flex;flex-wrap:wrap;gap:8px;margin:1em 0}
  .vpill{padding:5px 12px;border-radius:999px;font-family:var(--mono);font-size:12px;background:var(--gray-50);border:1px solid var(--gray-100);color:var(--gray-700)}
  .vpill.v-true{background:#f6e9dd;color:#a44a2e;border-color:transparent}
  .vpill.v-part{background:#f3ead9;color:#8a6512;border-color:transparent}
  .vpill .n{font-weight:700}
  table.conflict th:nth-child(1){width:25%}table.conflict th:nth-child(2){width:25%}table.conflict th:nth-child(3){width:13%}

  /* ---- 断言卡（ch3）：.claim > .claim-row（.claim-id/.claim-txt/.v）+ details.fold；.claim-title 模型摘要行（非标题元素）---- */
  .claims{margin:1.2em 0}
  .claim{border:1px solid var(--gray-100);border-radius:12px;background:var(--paper);margin:0 0 10px;overflow:hidden}
  .claim-row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;padding:12px 16px 10px}
  .claim-id{font-family:var(--mono);font-weight:700;color:var(--clay);font-size:13px;padding-top:3px;text-align:right}
  .claim-txt{margin:0;font-size:14.5px;line-height:1.66;color:var(--slate)}
  .claim .v{margin-top:2px;white-space:nowrap}
  .claim-title{margin:0;padding:12px 16px 0;font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.45;color:var(--slate)}
  .claim-title::before{content:"▍";color:var(--clay);margin-right:6px}
  .claim details.fold{margin:0;border:none;border-top:1px dashed var(--gray-100);border-radius:0;background:var(--gray-50)}
  .claim details.fold > summary{padding:7px 16px;font-size:12px}
  .claim details.fold > *:not(summary){padding:2px 16px 12px}
  @media(max-width:640px){.claim-row{grid-template-columns:26px 1fr}.claim .v{grid-column:2}}

  /* ---- 事件摘要（ch1，模型生成两段式）：.abstract（.abs-label + .abs-txt×2）---- */
  .abstract{margin:1.2em 0 1.4em;padding:18px 22px 16px;border:1.5px solid var(--gray-200);border-left:4px solid var(--clay);border-radius:var(--radius);background:var(--paper);max-width:none;width:100%}
  .abstract .abs-label{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--gray-500);margin-bottom:10px}
  .abstract .abs-label::before{content:"";display:inline-block;width:22px;height:2px;background:var(--clay);vertical-align:middle;margin-right:9px}
  .abstract .abs-txt{margin:0 0 .55em;font-family:var(--serif);font-size:16px;line-height:1.95;color:var(--slate);text-align:justify;max-width:none}
  .abstract .abs-txt:last-child{margin-bottom:0}
</style>
</head>
<body>
<main class="wrap">

<!-- CONTENT_START -->

<!-- 每个报告的正文从这里开始（h2 为章标题）。
     注意：内容已由模板自动包裹在 <main class="wrap"> 容器内（页边距/居中已生效），
     正文里请勿再包一层 .wrap，直接写章节与组件即可。
     组件约定（v0.2 Editorial）：
     - 结论速览：<div class="meta-box"><dl><dt>键</dt><dd>值</dd>...</dl></div>
     - 引用链接：<a href="#refN" class="ref">[N]</a>；来源索引锚点行：<tr id="refN" class="source-B"><td>[N]</td>...</tr>
     - 确定性标记：<span class="mark mark-official">▲官方</span> / mark-multi ● / mark-single △ / mark-caution
     - 时间线：<div class="report-list"><article class="report-row"><time>日期</time><div><strong>标题</strong><span>说明</span></div></article></div>
     - 立场：<article class="stance-row"><span class="label">立场名</span><p>内容</p></article>
     - 卡片：<div class="grid"><article class="card"><h3>...</h3><p>...</p><div class="meta">元数据</div></article></div>
     - 仪表盘 KPI（大数字卡）：<div class="kpis"><div class="kpi-card"><div class="kpi-num">7<span>条</span></div><div class="kpi-lab">采集量</div><div class="kpi-sub">平台/说明</div></div>…</div>（百宝袋结论速览自动输出；报告头部如需"一眼看规模/可信度"可手写）
     - 章节导读：<p class="chapter-intro">本章一句话导航/导读</p>（百宝袋程序化生成；LLM 亦可手写）
     - 折叠（长原文/长列表收纳）：<details class="fold"><summary>展开原文</summary><blockquote>…</blockquote></details>（打印时自动展开；渐缓弹出由装配端 fold-replay JS 以 WAAPI 实现——CSS animation 在 details 隐藏子树不重放，故必须用命令式动画，片段见演示稿内联脚本；无 JS 时回退原生瞬开）
     - P1 可视化（build_report 自动输出，纯 CSS）：立场条形 .bars/.bar-row/.bar-fill；小结行 .stat-line；覆盖矩阵 table.matrix 之 .cell-ok/.cell-miss/.cell-gap；焦点堆叠 .stacks/.stack-row/.stack-seg(.s1-.s6)/.stack-legend（图例色块 <i class="s1..s6"> 与段色一致，v0.2.13 起支持）；冲突对照 table.conflict
     - 可视化补充（v0.2.13）：双栏 .chart-split（两列图表区，≤880px 单列）；环形图 = .donut（inline conic-gradient 百分比直转 deg 分段）+ .donut-legend（色块图例，可含 <b> 数值）；趋势折线 = .trend 容器（.trend-head 标题/副注 + svg.trend-svg：网格 .grid-line、折线 .line(.s1-.s4)、面积 polygon.area、数据点 .dot、坐标轴 <text> + .trend-legend），SVG 坐标由生成端按数据计算（--stance-trend），LLM 手写需自算坐标、不建议
     - 视点综合（v0.2.13）：h3 标题后紧跟 .viewpoint-meta 信息条（.viewpoint-snap 徽章「动态快照 · 日期」+ 一句说明）即视为视点综合小节；h3 保持 <main> 直接子级以保留自动编号（h3:has(+ .viewpoint-meta) 只调间距不动编号）；LLM --viewpoint md 注入时置于该节正文前
